services:
  postgres:
    image: postgres:16-alpine
    container_name: sega-hub-postgres
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sega}
      POSTGRES_USER: ${POSTGRES_USER:-sega}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sega_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sega} -d ${POSTGRES_DB:-sega}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sega-net

  bas-gateway:
    image: ghcr.io/pt-perkasa-pilar-utama/bas-iot-gateway:${BAS_GATEWAY_IMAGE_TAG:-latest}
    build:
      context: ./BAS-IoT-Gateway
      dockerfile: Dockerfile
    container_name: sega-hub-bas-gateway
    restart: unless-stopped
    environment:
      BAS_PORT: "8000"
      BAS_DB_PATH: /app/data/gateway.db
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-host.docker.internal}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      SEGA_BASE_URL: http://sega:8080
      SEGA_GATEWAY_TOKEN: ${SEGA_GATEWAY_TOKEN:-}
      BAS_UPDATER_URL: http://updater:8090
      BAS_UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    ports:
      - "${BAS_GATEWAY_HOST_PORT:-8000}:8000"
    volumes:
      - bas_gateway_data:/app/data
    networks:
      - sega-net

  sega:
    image: ghcr.io/pt-perkasa-pilar-utama/sega:${SEGA_IMAGE_TAG:-latest}
    build:
      context: ./SEGA
      dockerfile: Dockerfile
    container_name: sega-hub-app
    restart: unless-stopped
    environment:
      PORT: "8080"
      WEB_DIST_DIR: /app/web/dist
      DATABASE_URL: ${DATABASE_URL:-postgres://sega:sega_local_dev@postgres:5432/sega?sslmode=disable}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      DEV_OPEN_ACCESS: ${DEV_OPEN_ACCESS:-false}
      SEGA_CORS_ALLOWED_ORIGINS: ${SEGA_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      SEGA_GATEWAY_TOKEN: ${SEGA_GATEWAY_TOKEN:-}
      SEGA_UPDATER_URL: http://updater:8090
      SEGA_UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      CODEX_PATH: /usr/local/bin/codex
      CODEX_WORKDIR: /app/work
      HOME: /app/work/cli-home
    ports:
      - "${SEGA_HOST_PORT:-8081}:8080"
    volumes:
      - sega_work:/app/work
      - ${CODEX_HOST_DIR:-./.codex-home}:/app/work/cli-home/.codex
    networks:
      - sega-net

  updater:
    build:
      context: ./updater
      dockerfile: Dockerfile
    container_name: sega-hub-updater
    profiles: ["updater"]
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      UPDATER_COMPOSE_FILE: /compose/docker-compose.yml
      UPDATER_PROJECT_DIR: /compose
      UPDATER_ALLOWED_SERVICES: sega,bas-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro
    networks:
      - sega-net

volumes:
  postgres_data:
  bas_gateway_data:
  sega_work:

networks:
  sega-net:
    driver: bridge
