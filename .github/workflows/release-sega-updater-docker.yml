name: SEGA-Updater Docker GHCR Release

on:
  push:
    branches:
      - main
    paths:
      - "updater/**"
      - ".github/workflows/release-sega-updater-docker.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit version override (e.g. v0.1.0)"
        required: false
        default: ""
      bump:
        description: "Semver bump when auto-incrementing"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: sega-hub-docker-sega-updater
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate & Publish SEGA-Updater GHCR Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout SEGA-HUB
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Source Commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Updater Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile updater/server.py
          python3 -m unittest discover -s updater -p "test_*.py" -v

      - name: Resolve GHCR Version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/resolve-ghcr-version.py \
            --owner "PT-Perkasa-Pilar-Utama" \
            --package "sega-updater" \
            --start-version "0.1.0" \
            --override-version "${{ inputs.version || '' }}" \
            --bump "${{ inputs.bump || 'patch' }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push SEGA-Updater Image (linux/amd64)
        uses: docker/build-push-action@v7.4.0
        with:
          context: updater
          file: updater/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pt-perkasa-pilar-utama/sega-updater:${{ steps.version.outputs.version }}
            ghcr.io/pt-perkasa-pilar-utama/sega-updater:latest
          labels: |
            org.opencontainers.image.title=SEGA-Updater
            org.opencontainers.image.source=https://github.com/PT-Perkasa-Pilar-Utama/SEGA-HUB
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=sega-updater-docker
          cache-to: type=gha,mode=max,scope=sega-updater-docker
