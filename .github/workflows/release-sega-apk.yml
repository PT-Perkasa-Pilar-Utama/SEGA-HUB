name: SEGA Android APK Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "SEGA branch, tag, or commit SHA to build"
        required: false
        default: "main"
      server_url:
        description: "Backend server URL for Android Capacitor app"
        required: false
        default: "https://sega.devoutsys.com"

permissions: {}

concurrency:
  group: sega-hub-apk-release
  cancel-in-progress: false

jobs:
  validate:
    name: Full Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Check SEGA Source Token
        env:
          SEGA_SOURCE_TOKEN: ${{ secrets.SEGA_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SEGA_SOURCE_TOKEN" ]; then
            echo "::error::Missing repository secret SEGA_SOURCE_TOKEN (requires Contents: Read on PT-Perkasa-Pilar-Utama/SEGA)."
            exit 1
          fi

      - name: Checkout SEGA Source
        uses: actions/checkout@v7.0.1
        with:
          repository: PT-Perkasa-Pilar-Utama/SEGA
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.SEGA_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Validate Release Scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/android/resolve-release-version.py scripts/android/prepare-generated-project.py
          python3 -m unittest discover -s scripts/android -p "test_release_version.py"

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Web Frontend Check
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci --prefer-offline --no-audit || npm install
          npm test
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      - name: Backend Vet & Test
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test -count=1 ./internal/...
          CGO_ENABLED=0 go build -o ./bin/sega ./cmd/sega

  android-build:
    name: Build SEGA Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check SEGA Source Token
        env:
          SEGA_SOURCE_TOKEN: ${{ secrets.SEGA_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SEGA_SOURCE_TOKEN" ]; then
            echo "::error::Missing repository secret SEGA_SOURCE_TOKEN (requires Contents: Read on PT-Perkasa-Pilar-Utama/SEGA)."
            exit 1
          fi

      - name: Checkout SEGA Source
        uses: actions/checkout@v7.0.1
        with:
          repository: PT-Perkasa-Pilar-Utama/SEGA
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.SEGA_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Source Commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve Release Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          INITIAL_RELEASE_VERSION: "0.1.0"
          RELEASE_TAG_PREFIX: "v"
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/android/resolve-release-version.py

      - name: Set up Java
        if: steps.version.outputs.already_published != 'true'
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        if: steps.version.outputs.already_published != 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web Assets & Sync Capacitor Android
        if: steps.version.outputs.already_published != 'true'
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.ANDROID_SERVER_URL || 'https://sega.devoutsys.com' }}
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci --prefer-offline --no-audit || npm install
          npm run build
          npx cap sync android

      - name: Configure Keystore Signing (if secret provided)
        if: steps.version.outputs.already_published != 'true'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_RELEASE_KEYSTORE_BASE64" ] && [ -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "Configuring release keystore signing..."
            keystore="$RUNNER_TEMP/sega-release.p12"
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            chmod 600 "$keystore"
            properties="android/keystore.properties"
            {
              printf 'storeFile=%s\n' "$keystore"
              printf 'storePassword=%s\n' "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_RELEASE_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD"
            } > "$properties"
            chmod 600 "$properties"
          else
            echo "No release keystore secret configured; building standard debug-signed APK."
          fi

      - name: Prepare Generated Android Project
        if: steps.version.outputs.already_published != 'true'
        env:
          ANDROID_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/android/prepare-generated-project.py

      - name: Build Android APK
        if: steps.version.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Verify and Package APK
        if: steps.version.outputs.already_published != 'true'
        id: package
        env:
          ANDROID_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/android/verify-apk.sh

      - name: Publish Release to SEGA-HUB
        if: steps.version.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: PT-Perkasa-Pilar-Utama/SEGA
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          ANDROID_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          EXPECTED_SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          source_apk="dist/android/$APK_NAME"
          test -s "$source_apk"
          actual_sha="$(sha256sum "$source_apk" | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA256"

          repo="$RELEASE_REPOSITORY"
          tag="${{ steps.version.outputs.tag }}"
          notes=$(printf 'SEGA v%s\n\nAndroid APK `%s` (version code %s).\nSHA-256: `%s`\nSource repository: %s\nSource commit: %s\n' \
            "$ANDROID_VERSION" "$APK_NAME" "$ANDROID_VERSION_CODE" "$EXPECTED_SHA256" "$SOURCE_REPOSITORY" "$SOURCE_COMMIT")

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists on $repo; refusing to replace its APK"
            exit 1
          fi

          gh release create "$tag" "$source_apk" \
            --repo "$repo" \
            --target main \
            --title "SEGA $tag" \
            --notes "$notes"
          gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
